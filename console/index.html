<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedProtec · Consola</title>
<style>
  :root{
    --bg:#070b12; --bg2:#0b111b; --panel:#0e1520; --panel2:#111a27;
    --line:#1b2636; --line2:#243347;
    --ink:#eaf6ff; --muted:#8ea6bf; --muted2:#5f7a94;
    --cyan:#22d3ee; --green:#34d399; --amber:#f5b642; --red:#f2555a; --violet:#8ab4ff;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;max-width:100%;overflow-x:hidden}
  body{
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(34,211,238,.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(52,211,153,.07), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:14px;
  }
  button{font:inherit;cursor:pointer}
  a{color:var(--cyan)}
  .hidden{display:none!important}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
  .login-card{width:min(94vw,400px);padding:34px 30px}
  .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:8px}
  .brand .wm{font-weight:800;letter-spacing:.14em;font-size:20px}
  .brand .wm .g{background:linear-gradient(120deg,var(--green),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .login-card h1{font-size:15px;font-weight:600;color:var(--muted);text-align:center;margin:2px 0 24px;letter-spacing:.02em}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;
    padding:12px 13px;color:var(--ink);font:inherit;outline:none}
  input:focus{border-color:var(--cyan)}
  .btn{width:100%;margin-top:22px;background:linear-gradient(120deg,var(--cyan),var(--green));
    color:#04141a;border:none;border-radius:11px;padding:13px;font-weight:800;letter-spacing:.02em}
  .btn:disabled{opacity:.55;cursor:default}
  .err{color:var(--red);font-size:12.5px;margin-top:14px;min-height:1em;text-align:center}
  .hint{color:var(--muted);font-size:11.5px;text-align:center;margin-top:18px;line-height:1.5}

  /* ---------- SHELL ---------- */
  #app{display:grid;grid-template-columns:242px 1fr;min-height:100vh}
  .side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side .top{padding:22px 20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
  .side .wm{font-weight:800;letter-spacing:.12em;font-size:16px}
  .side .wm .g{background:linear-gradient(120deg,var(--green),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  nav{padding:14px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
  .navi{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;color:var(--muted);
    background:none;border:none;text-align:left;font-weight:600;transition:.15s;width:100%}
  .navi svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9}
  .navi:hover{background:var(--panel);color:var(--ink)}
  .navi.active{background:rgba(34,211,238,.12);color:var(--cyan)}
  .navi .nb{margin-left:auto;font-size:10.5px;font-weight:900;background:var(--red);color:#160406;
    border-radius:20px;padding:1px 7px;min-width:18px;text-align:center}
  .menutoggle{display:none;background:var(--panel);border:1px solid var(--line2);color:var(--ink);
    border-radius:9px;width:42px;height:38px;align-items:center;justify-content:center;margin-left:auto}
  .menutoggle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
  .menutoggle:hover{border-color:var(--cyan)}
  .menutoggle.on{border-color:var(--cyan);color:var(--cyan)}
  .side .foot{padding:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .side .foot .acct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
  .logout{width:100%;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:9px;padding:9px;font-weight:600}
  .logout:hover{border-color:var(--red);color:var(--red)}

  main{padding:26px 30px 60px;max-width:1200px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
  .topbar h2{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .tbtns{display:flex;gap:10px;align-items:center}
  .refresh,.autob{background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:10px;
    padding:9px 15px;font-weight:600;display:flex;gap:8px;align-items:center}
  .refresh:hover,.autob:hover{border-color:var(--cyan)}
  .refresh svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
  .autob.on{border-color:var(--green);color:var(--green);background:rgba(52,211,153,.09)}
  .autob .led{width:8px;height:8px;border-radius:50%;background:var(--muted2)}
  .autob.on .led{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---------- COPILOTO (IA al frente) ---------- */
  .copilot{background:linear-gradient(135deg,rgba(34,211,238,.10),rgba(52,211,153,.06)),var(--panel2);
    border:1px solid var(--line2);border-radius:18px;padding:22px 22px 20px;margin-bottom:24px;
    position:relative;overflow:hidden}
  .copilot::before{content:"";position:absolute;inset:0;border-radius:18px;padding:1px;
    background:linear-gradient(120deg,rgba(34,211,238,.5),rgba(52,211,153,.3),transparent 60%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
  .copilot .ct{display:flex;align-items:center;gap:11px;margin-bottom:4px}
  .copilot .ct .ai{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--cyan),var(--green))}
  .copilot .ct h3{margin:0;font-size:17px;font-weight:800}
  .copilot .ct .tag{font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--green);
    border:1px solid var(--green);border-radius:6px;padding:2px 7px;margin-left:2px}
  .copilot .lead{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.45}
  .cbar{display:flex;gap:10px;flex-wrap:wrap}
  .cbar input{flex:1 1 180px;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:12px;
    padding:14px 16px;font-size:15px}
  .cbar input:focus{border-color:var(--cyan)}
  .cbar .go{background:linear-gradient(120deg,var(--cyan),var(--green));color:#04141a;border:none;
    border-radius:12px;padding:0 22px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .cbar .go:disabled{opacity:.55;cursor:default}
  .cbar .go svg{width:16px;height:16px;stroke:#04141a;fill:none;stroke-width:2.4}
  .csug{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .csug .s{font-size:12px;color:var(--muted);background:var(--bg2);border:1px solid var(--line2);
    border-radius:20px;padding:6px 12px}
  .csug .s:hover{border-color:var(--cyan);color:var(--ink)}
  .cout{margin-top:16px}
  .cnote{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:14px 16px;
    color:var(--ink);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
  .cnote.warn{border-color:var(--amber)}
  .cnote.bad{border-color:var(--red)}
  .prop{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:16px 18px}
  .prop .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .prop .ph .act{font-size:16px;font-weight:800}
  .prop .ph .dev{font-size:16px;font-weight:800;color:var(--cyan)}
  .prop .pmeta{color:var(--muted);font-size:12.5px;margin-bottom:12px}
  .psite{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .psite .nm{font-weight:600}
  .psite .rs{margin-left:auto;font-size:12px}
  .psite .ok{color:var(--green)} .psite .no{color:var(--muted2)}
  .prop .pact{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .prop .exec{background:var(--red);color:#fff;border:none;border-radius:11px;padding:11px 20px;font-weight:800}
  .prop .exec.trust{background:var(--green);color:#04141a}
  .prop .exec.unblock{background:var(--cyan);color:#04141a}
  .prop .exec:disabled{opacity:.5;cursor:default;background:var(--line2);color:var(--muted)}
  .prop .cancel{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:11px;padding:11px 16px;font-weight:700}
  .cand{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .cand .c{font-size:12.5px;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:7px 11px}
  .cand .c:hover{border-color:var(--cyan)}

  /* cards / grid */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .stat .v{font-size:26px;font-weight:900;line-height:1}
  .stat .l{color:var(--muted);font-size:12.5px;margin-top:7px}
  .hero{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line2);
    border-radius:16px;padding:20px 22px;margin-bottom:22px;display:flex;gap:16px;align-items:center}
  .hero .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
  .hero h3{margin:0;font-size:18px;font-weight:800;line-height:1.3}
  .hero .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}

  .section-t{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
  .section-t .cnt{font-size:11px;background:var(--panel2);border:1px solid var(--line2);border-radius:20px;padding:1px 9px;color:var(--ink)}
  .corr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .corr .h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
  .corr .h b{font-size:14.5px}
  .badge{font-size:10px;font-weight:900;letter-spacing:.05em;padding:3px 8px;border-radius:7px;border:1px solid}
  .corr p{margin:6px 0 0;color:var(--muted);line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--line2);
    background:var(--bg2);display:inline-flex;gap:5px;align-items:center}
  .reco{margin-top:10px;background:rgba(34,211,238,.07);border-radius:10px;padding:10px 12px;font-size:12.5px;display:flex;gap:8px}

  .atn{display:flex;align-items:flex-start;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:13px 15px;margin-bottom:10px}
  .atn .bar{width:4px;align-self:stretch;border-radius:2px;flex:0 0 auto}
  .atn b{font-size:14px}
  .atn p{margin:3px 0 0;color:var(--muted);font-size:12.5px}

  /* fleet grid tiles */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .ftile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;
    border-left:4px solid var(--muted2);position:relative;text-align:left;transition:.15s}
  .ftile:hover{border-color:var(--line2);transform:translateY(-2px)}
  .ftile .fn{font-weight:800;font-size:14.5px;margin-bottom:2px;display:flex;align-items:center;gap:8px}
  .ftile .fst{font-size:11.5px;color:var(--muted);margin-bottom:12px}
  .ftile .fm{display:flex;gap:14px}
  .ftile .fm .m .n{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  .ftile .fm .m .t{font-size:10.5px;color:var(--muted);margin-top:3px}

  /* ---------- EQUIPOS ---------- */
  .dvtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .dvtab{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:20px;
    padding:8px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
  .dvtab.active{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.10)}
  .dvtab .d{width:7px;height:7px;border-radius:50%}
  .dvtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .dvsearch{flex:1 1 220px;min-width:0;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;
    padding:11px 14px;color:var(--ink);font:inherit}
  .dvsearch:focus{border-color:var(--cyan)}
  .dvchips{display:flex;gap:7px;flex-wrap:wrap}
  .dvchip{background:var(--bg2);border:1px solid var(--line2);color:var(--muted);border-radius:20px;
    padding:7px 12px;font-size:12.5px;font-weight:600}
  .dvchip.active{border-color:var(--cyan);color:var(--ink);background:rgba(34,211,238,.10)}
  .expbtn{background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:10px;
    padding:10px 14px;font-weight:600;display:flex;gap:8px;align-items:center}
  .expbtn:hover{border-color:var(--green)}
  .dev{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);
    border-radius:13px;padding:13px 15px;margin-bottom:9px;flex-wrap:wrap}
  .dev .ava{width:40px;height:40px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
    background:var(--bg2);font-size:18px;position:relative}
  .dev .ava .ol{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;
    border:2px solid var(--panel)}
  .dev .meta{flex:1 1 200px;min-width:0}
  .dev .meta .nm{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dev .meta .sub{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
  .crit{font-size:9.5px;font-weight:900;letter-spacing:.04em;padding:2px 7px;border-radius:6px;
    border:1px solid var(--amber);color:var(--amber);background:#f5b64222}
  .tpill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .tpill.trusted{color:var(--green);background:#34d39922}
  .tpill.blocked{color:var(--red);background:#f2555a22}
  .tpill.unknown{color:var(--muted);background:var(--bg2);border:1px solid var(--line2)}
  .dev .acts{display:flex;gap:7px;flex-wrap:wrap}
  .dvbtn{border:1px solid var(--line2);background:var(--bg2);color:var(--ink);border-radius:9px;
    padding:8px 12px;font-weight:700;font-size:12.5px}
  .dvbtn:hover{border-color:var(--cyan)}
  .dvbtn.block:hover{border-color:var(--red);color:var(--red)}
  .dvbtn.trust:hover{border-color:var(--green);color:var(--green)}
  .dvbtn:disabled{opacity:.4;cursor:default}
  .dvnote{background:rgba(245,182,66,.08);border:1px solid var(--amber);border-radius:11px;
    padding:12px 15px;margin-bottom:14px;font-size:12.5px;display:flex;gap:9px;align-items:flex-start}
  .dvsel{width:18px;height:18px;flex:0 0 auto;accent-color:#22d3ee;cursor:pointer;margin:0}
  .dvopen{cursor:pointer}
  .dvbulk{position:sticky;top:8px;z-index:6;display:flex;gap:9px;align-items:center;flex-wrap:wrap;
    background:var(--panel2);border:1px solid var(--cyan);border-radius:12px;padding:11px 14px;margin-bottom:12px;
    box-shadow:var(--shadow)}
  .dvbulk b{color:var(--cyan)} .dvbulk .sp{flex:1}
  .dvbulk .bk{background:var(--red);color:#fff;border:none;border-radius:9px;padding:8px 13px;font-weight:800;font-size:12.5px}
  .dvbulk .tr{background:var(--green);color:#04141a;border:none;border-radius:9px;padding:8px 13px;font-weight:800;font-size:12.5px}
  .dvbulk .ub{background:var(--cyan);color:#04141a;border:none;border-radius:9px;padding:8px 13px;font-weight:800;font-size:12.5px}
  .dvbulk .cl{background:none;border:1px solid var(--line2);color:var(--muted);border-radius:9px;padding:8px 12px;font-weight:700;font-size:12.5px}
  /* modal ficha de equipo */
  .modal{position:fixed;inset:0;background:rgba(3,6,11,.74);backdrop-filter:blur(4px);
    display:grid;place-items:center;padding:18px;z-index:100}
  .modalcard{background:var(--panel);border:1px solid var(--line2);border-radius:18px;
    width:min(96vw,460px);max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
  .mch{display:flex;align-items:center;gap:13px;padding:20px 22px;border-bottom:1px solid var(--line)}
  .mch .ava{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;background:var(--bg2);font-size:24px;position:relative;flex:0 0 auto}
  .mch .ava .ol{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--panel)}
  .mch .nm{font-size:18px;font-weight:800;line-height:1.2}
  .mch .close{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--muted);
    border-radius:9px;width:34px;height:34px;font-size:18px;flex:0 0 auto}
  .mch .close:hover{border-color:var(--red);color:var(--red)}
  .mbody{padding:6px 22px 8px}
  .mrow{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:none}
  .mrow .k{color:var(--muted);font-size:12.5px}
  .mrow .v{font-weight:600;font-size:13.5px;text-align:right;word-break:break-word}
  .macts{display:flex;gap:9px;flex-wrap:wrap;padding:14px 22px 22px}
  .macts .dvbtn{flex:1 1 auto;text-align:center;padding:11px}

  /* ---------- MAPA DE RED ---------- */
  .mapwrap{background:radial-gradient(circle at 50% 45%,rgba(34,211,238,.06),transparent 60%),var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:8px;overflow:hidden}
  .mapwrap svg{width:100%;height:auto;display:block}
  .mapnode{cursor:pointer}
  .mapnode:hover circle.bg{stroke-width:5}
  .maplegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--muted)}
  .maplegend .lg{display:flex;gap:7px;align-items:center}
  .maplegend .d{width:11px;height:11px;border-radius:50%;flex:0 0 auto}

  /* ---------- SALA DE GUERRA (NOC) ---------- */
  .warhero{display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;
    background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line2);
    border-radius:18px;padding:22px 26px;margin-bottom:22px}
  @media(max-width:640px){.warhero{grid-template-columns:1fr;text-align:center;justify-items:center}}
  .gauge{position:relative;width:150px;height:150px;flex:0 0 auto}
  .gauge svg{transform:rotate(-90deg)}
  .gauge .gv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .gauge .gv .p{font-size:32px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .gauge .gv .s{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:700}
  .warhead .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:6px}
  .warhead h3{margin:0 0 10px;font-size:20px;font-weight:800;line-height:1.25}
  .warhead .mini{display:flex;gap:22px;flex-wrap:wrap}
  .warhead .mini .m .n{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
  .warhead .mini .m .t{font-size:11px;color:var(--muted);margin-top:3px}
  .fsbtn{background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:10px;
    padding:9px 15px;font-weight:600;display:flex;gap:8px;align-items:center;white-space:nowrap}
  .fsbtn:hover{border-color:var(--cyan)}
  .fsbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

  .inc{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--red);
    border-left-width:4px;border-radius:12px;padding:13px 16px;margin-bottom:10px}
  .inc.acked{border-color:var(--amber);border-left-color:var(--amber);opacity:.9}
  .inc .beat{width:11px;height:11px;border-radius:50%;background:var(--red);flex:0 0 auto;
    box-shadow:0 0 0 0 rgba(242,85,90,.6);animation:beat 1.4s infinite}
  .inc.acked .beat{background:var(--amber);animation:none}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(242,85,90,.55)}70%{box-shadow:0 0 0 10px rgba(242,85,90,0)}100%{box-shadow:0 0 0 0 rgba(242,85,90,0)}}
  .inc .ib{flex:1}
  .inc .ib b{font-size:14.5px}
  .inc .ib p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .inc .esc{font-size:10px;font-weight:900;letter-spacing:.05em;padding:3px 8px;border-radius:7px;
    border:1px solid var(--red);color:var(--red);background:#f2555a22}
  .inc .ack{background:var(--red);color:#fff;border:none;border-radius:10px;padding:9px 15px;font-weight:800;white-space:nowrap}
  .inc.acked .ackedlbl{color:var(--amber);font-weight:800;font-size:12.5px;white-space:nowrap}

  .slarow .ub{display:flex;align-items:center;gap:9px}
  .slarow .updot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

  .feed{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .feed .fi{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line)}
  .feed .fi:last-child{border-bottom:none}
  .feed .fi .ico{width:26px;height:26px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:13px;background:var(--bg2)}
  .feed .fi .tx{flex:1;font-size:13px;line-height:1.35}
  .feed .fi .tx .who{font-weight:700}
  .feed .fi .tx .det{color:var(--muted);font-size:12px}
  .feed .fi .ago{color:var(--muted2);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  #app:fullscreen{background:var(--bg)} #app:-webkit-full-screen{background:var(--bg)}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;overflow:hidden}
  thead th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
    font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line)}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .num{font-variant-numeric:tabular-nums}
  .barwrap{height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;min-width:90px}
  .barfill{height:100%;background:var(--cyan)}
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  .tscroll table{min-width:520px}
  .loading,.empty{color:var(--muted);padding:30px;text-align:center}
  .priceRow{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .priceRow input{width:170px}
  .priceRow .btn{width:auto;margin:0;padding:10px 18px}
  .muted{color:var(--muted)}

  /* políticas */
  .polwrap{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}
  @media(max-width:820px){
    .polwrap{grid-template-columns:1fr}
    /* barra lateral → cabecera superior con nav horizontal desplazable.
       display:block evita el "grid blowout" (columna 1fr con mínimo auto que el
       nav horizontal inflaba, quedando recortado por overflow-x:hidden). */
    #app{display:block;min-width:0}
    .side{position:sticky;top:0;height:auto;width:100%;max-width:100%;min-width:0;
      flex-direction:column;z-index:30;border-right:none;border-bottom:1px solid var(--line);
      background:rgba(11,17,27,.96);backdrop-filter:blur(8px)}
    .side .top{padding:12px 16px;align-items:center}
    .menutoggle{display:flex}
    /* menú = desplegable bajo el encabezado (no más deslizar) */
    nav{position:absolute;top:100%;left:0;right:0;display:none;flex-direction:column;
      padding:8px;gap:3px;background:var(--bg2);border-bottom:1px solid var(--line);
      box-shadow:var(--shadow);z-index:40}
    nav.open{display:flex}
    .navi{width:100%;padding:13px 14px;white-space:nowrap}
    .navi .nb{margin-left:auto}
    .side .foot{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
    .side .foot .acct{margin-bottom:0;flex:1;font-size:11px}
    .logout{width:auto;padding:7px 13px;flex:0 0 auto}
    main{padding:18px 15px 70px;max-width:100%;width:100%;min-width:0}
    .topbar{margin-bottom:16px}
    .topbar h2{font-size:19px}
    .warhero{grid-template-columns:1fr;text-align:center;justify-items:center;gap:16px;padding:20px 16px}
    .warhead .mini{justify-content:center;gap:18px}
    .fsbtn{display:none}
    .hero{flex-direction:column;text-align:center;align-items:center}
    .stats{gap:11px}
    .stat .v{font-size:23px}
  }
  @media(max-width:400px){.stats{grid-template-columns:1fr 1fr}}
  .polcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .polcard h4{margin:0 0 4px;font-size:15px}
  .polrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
  .polrow:first-of-type{border-top:none}
  .polrow .lab{flex:1}
  .polrow .lab b{font-size:13.5px;font-weight:700}
  .polrow .lab p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
  .sw{width:44px;height:25px;border-radius:20px;background:var(--line2);border:none;position:relative;flex:0 0 auto;transition:.18s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.18s}
  .sw.on{background:linear-gradient(120deg,var(--cyan),var(--green))}
  .sw.on::after{left:22px}
  .polnum{width:74px}
  .polhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .polhead .big{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
  .polsite{display:flex;align-items:flex-start;gap:11px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;margin-bottom:9px}
  .polsite .bar{width:4px;align-self:stretch;border-radius:2px;flex:0 0 auto}
  .polsite b{font-size:13.5px}
  .polsite p{margin:3px 0 0;font-size:12px;color:var(--muted)}
  .savebar{display:flex;gap:10px;align-items:center;margin-top:16px}
  .savebar .btn{width:auto;margin:0;padding:11px 20px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);
    border:1px solid var(--green);color:var(--ink);border-radius:12px;padding:12px 20px;font-weight:600;
    box-shadow:var(--shadow);z-index:50;display:flex;gap:9px;align-items:center}
  .toast.bad{border-color:var(--red)}
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="login">
  <div class="card login-card">
    <div class="brand">
      <span id="logo-login"></span>
      <span class="wm"><span class="g">RED</span>PROTEC</span>
    </div>
    <h1>Consola de operaciones</h1>
    <form id="loginForm" autocomplete="on">
      <label for="email">Correo</label>
      <input id="email" type="email" required placeholder="tucorreo@ejemplo.com">
      <label for="password">Contraseña</label>
      <input id="password" type="password" required placeholder="••••••••">
      <button class="btn" id="loginBtn" type="submit">Entrar</button>
      <div class="err" id="loginErr"></div>
    </form>
    <div class="hint">Entra con la misma cuenta de tu app RedProtec.<br>Ves tus sedes y tu flota, no la red local de este equipo.</div>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="top"><span id="logo-side"></span><span class="wm"><span class="g">RED</span>PROTEC</span>
      <button class="menutoggle" id="menuBtn" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button></div>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="acct" id="acct">—</div>
      <button class="logout" id="logout">Cerrar sesión</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div>
        <h2 id="viewTitle">Centro</h2>
        <div class="sub" id="viewSub"></div>
      </div>
      <div class="tbtns">
        <button class="autob" id="autoBtn"><span class="led"></span> Auto</button>
        <button class="refresh" id="refreshBtn">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg> Actualizar
        </button>
      </div>
    </div>
    <div id="content"><div class="loading">Cargando…</div></div>
  </main>
</div>

<script>
const CFG = {
  SUPABASE_URL: "https://llxeahaxxdgtcvldqlwt.supabase.co",
  ANON: "sb_publishable_YTA2Tm2bqXVZKOF0KPXbbw_eE4f_L4k",
};
const LOGO_SVG = `<svg width="30" height="30" viewBox="0 0 512 512" fill="none">
  <defs><linearGradient id="e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="w" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#eafcff"/></linearGradient></defs>
  <path d="M256 100C210 100 150 108 116 120 106 123 100 130 100 142L100 262C100 356 168 414 256 448 344 414 412 356 412 262L412 142C412 130 406 123 396 120 362 108 302 100 256 100Z" fill="#0f2436" stroke="url(#e)" stroke-width="14"/>
  <g stroke="url(#w)" stroke-width="26" stroke-linecap="round"><path d="M182 296 Q256 200 330 296"/><path d="M206 310 Q256 244 306 310"/><path d="M228 324 Q256 286 284 324"/></g>
  <circle cx="256" cy="342" r="15" fill="#eafcff"/></svg>`;
document.getElementById('logo-login').innerHTML = LOGO_SVG;
document.getElementById('logo-side').innerHTML = LOGO_SVG;

// ---------- auth ----------
const store = {
  get t(){ try{return localStorage.getItem('rp_at')}catch(e){return null} },
  set t(v){ try{v?localStorage.setItem('rp_at',v):localStorage.removeItem('rp_at')}catch(e){} },
  get r(){ try{return localStorage.getItem('rp_rt')}catch(e){return null} },
  set r(v){ try{v?localStorage.setItem('rp_rt',v):localStorage.removeItem('rp_rt')}catch(e){} },
  get email(){ try{return localStorage.getItem('rp_em')||''}catch(e){return ''} },
  set email(v){ try{localStorage.setItem('rp_em',v||'')}catch(e){} },
};

async function supaLogin(email, password){
  const res = await fetch(`${CFG.SUPABASE_URL}/auth/v1/token?grant_type=password`,{
    method:'POST', headers:{'apikey':CFG.ANON,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  });
  const j = await res.json();
  if(!res.ok) throw new Error(j.error_description||j.msg||j.error||'Correo o contraseña incorrectos');
  store.t=j.access_token; store.r=j.refresh_token; store.email=email;
  return j;
}
async function supaRefresh(){
  if(!store.r) return false;
  const res = await fetch(`${CFG.SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
    method:'POST', headers:{'apikey':CFG.ANON,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:store.r})
  });
  if(!res.ok) return false;
  const j = await res.json();
  store.t=j.access_token; store.r=j.refresh_token; return true;
}
// relay API. Refresca 1 vez ante 401. `opts` opcional para POST/PUT.
async function api(path, opts, _retry){
  const o = Object.assign({headers:{}}, opts||{});
  o.headers = Object.assign({'Authorization':`Bearer ${store.t}`}, o.headers);
  if(o.body && !o.headers['Content-Type']) o.headers['Content-Type']='application/json';
  const res = await fetch(path,o);
  if(res.status===401 && !_retry){ if(await supaRefresh()) return api(path,opts,true); logout(); throw new Error('Sesión expirada'); }
  let j=null; try{ j=await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error((j&&(j.detail||j.message))||('HTTP '+res.status)); err.status=res.status; err.body=j; throw err; }
  return j;
}
const apiPost=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
const apiPut =(p,b)=>api(p,{method:'PUT', body:JSON.stringify(b)});

// ---------- helpers ----------
const sevColor=s=>({critical:'var(--red)',high:'#ff9f45',medium:'var(--amber)',low:'var(--muted)'}[s]||'var(--cyan)');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmtBps(b){ b=+b||0; if(b>=1e6)return (b/1e6).toFixed(1)+' MB/s'; if(b>=1e3)return (b/1e3).toFixed(0)+' KB/s'; return b.toFixed(0)+' B/s'; }
function stat(v,l,col){ return `<div class="stat"><div class="v" style="color:${col||'var(--ink)'}">${esc(v)}</div><div class="l">${esc(l)}</div></div>`; }
function toast(msg,bad){ const t=document.createElement('div'); t.className='toast'+(bad?' bad':'');
  t.innerHTML=(bad?'⚠️ ':'✅ ')+esc(msg); document.body.appendChild(t); setTimeout(()=>t.remove(),3600); }

// ---------- views ----------
const VIEWS = [
  {id:'brief', title:'Centro', sub:'Copiloto que actúa + parte de tu flota', icon:'<path d="M12 3a5 5 0 0 0-5 5c0 2 1 3 1 5h8c0-2 1-3 1-5a5 5 0 0 0-5-5zM9 20h6M10 22h4"/>', render:renderBrief},
  {id:'war', title:'Sala de Guerra', sub:'Centro de operaciones en vivo · disponibilidad, incidentes on-call y SLA', icon:'<path d="M12 2v4M12 18v4M2 12h4M18 12h4M12 12l6-3M5 19l7-7"/><circle cx="12" cy="12" r="3"/>', render:renderWarRoom},
  {id:'sites', title:'Sedes', sub:'Todas tus redes/sedes en vivo', icon:'<path d="M4 21V8l8-5 8 5v13M9 21v-6h6v6"/>', render:renderSites},
  {id:'devices', title:'Equipos', sub:'Todos los dispositivos de tus redes — verlos y controlarlos', icon:'<path d="M4 5h16v10H4zM2 19h20M9 9h6"/>', render:renderDevices},
  {id:'map', title:'Mapa de red', sub:'Topología en vivo de tus equipos alrededor del router', icon:'<circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/>', render:renderMap},
  {id:'threats', title:'Amenazas', sub:'Correlacionadas entre sedes', icon:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/>', render:renderThreats},
  {id:'policy', title:'Políticas', sub:'El estándar de tu organización y su cumplimiento', icon:'<path d="M9 11l3 3 8-8M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>', render:renderPolicy},
  {id:'consumption', title:'Consumo', sub:'Quién consume más en tu flota', icon:'<path d="M3 3v18h18M8 15l3-4 3 3 4-6"/>', render:renderConsumption},
];
let current = 'brief';
let _nav = {};          // badges por vista
let _copilotPending=false;  // hay una propuesta activa → no auto-refrescar Centro

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML='';
  let activeBtn=null;
  VIEWS.forEach(v=>{
    const b=document.createElement('button');
    b.className='navi'+(v.id===current?' active':'');
    const badge=_nav[v.id]?`<span class="nb">${_nav[v.id]}</span>`:'';
    b.innerHTML=`<svg viewBox="0 0 24 24">${v.icon}</svg>${v.title}${badge}`;
    b.onclick=()=>go(v.id);
    nav.appendChild(b);
    if(v.id===current) activeBtn=b;
  });
}
function closeMenu(){ const n=document.getElementById('nav'); if(n) n.classList.remove('open');
  const b=document.getElementById('menuBtn'); if(b) b.classList.remove('on'); }
function toggleMenu(){ const n=document.getElementById('nav'); const b=document.getElementById('menuBtn');
  const open=!n.classList.contains('open'); n.classList.toggle('open',open); if(b) b.classList.toggle('on',open); }
function go(id){ current=id; _copilotPending=false; buildNav(); closeMenu(); const v=VIEWS.find(x=>x.id===id);
  document.getElementById('viewTitle').textContent=v.title;
  document.getElementById('viewSub').textContent=v.sub;
  load(); }
async function load(){
  const c=document.getElementById('content'); c.innerHTML='<div class="loading">Cargando…</div>';
  const v=VIEWS.find(x=>x.id===current);
  try{ await v.render(c); }
  catch(e){ c.innerHTML=`<div class="empty">No se pudo cargar. ${esc(e.message||'')}</div>`; }
}

/* ============ CENTRO: Copiloto (IA al frente) + Cerebro de Flota ============ */
async function renderBrief(c){
  const d = await api('/v1/fleet/brief');
  const s=d.stats||{};
  const ok = (!d.attention||!d.attention.length) && (!d.correlations||!d.correlations.length);
  const accent = ok?'var(--green)':'#ff9f45';

  // badge de navegación (amenazas necesitadas de atención)
  const atn=(d.attention||[]).length, corr=(d.correlations||[]).length;
  _nav.brief = (atn+corr)||0; buildNav();

  let h = copilotHTML();  // ← IA arriba del todo

  h+=`<div class="hero"><div class="ic" style="background:${accent}22">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${accent}" stroke-width="2">${ok?'<path d="M20 6L9 17l-5-5"/>':'<path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'}</svg></div>
      <div><div class="k">Cerebro de flota · parte único</div><h3>${esc(d.headline||'')}</h3></div></div>`;
  h+=`<div class="stats">
    ${stat((s.sites_online||0)+'/'+(s.sites_total||0),'Sedes en línea', s.sites_offline?'var(--red)':'var(--green)')}
    ${stat((s.devices_online||0)+'/'+(s.devices_total||0),'Equipos','var(--cyan)')}
    ${stat(s.criticals_down_total||0,'Críticos caídos', s.criticals_down_total?'var(--red)':'var(--muted)')}
    ${stat(s.unmanaged_total||0,'Sin gestionar', s.unmanaged_total?'#ff9f45':'var(--muted)')}
    ${stat(s.alerts_total||0,'Alertas', s.alerts_total?'var(--amber)':'var(--muted)')}
  </div>`;

  // rejilla de sedes en vivo
  try{
    const sd = await api('/v1/sites'); const sites=sd.sites||[];
    if(sites.length){
      h+=`<div class="section-t">Sedes en vivo <span class="cnt">${sites.length}</span></div><div class="fgrid">`;
      sites.forEach(st=>{ const on=st.online; const su=st.summary||{};
        const bad=(su.criticals_down||0)>0, warn=(su.alerts||0)>0;
        const col= !on?'var(--muted2)': bad?'var(--red)': warn?'var(--amber)':'var(--green)';
        h+=`<button class="ftile" style="border-left-color:${col}" onclick="go('sites')">
            <div class="fn"><span class="dot" style="background:${col}"></span>${esc(st.site_name)}</div>
            <div class="fst">${on?'En línea':'Sin conexión'}</div>
            <div class="fm">
              <div class="m"><div class="n">${su.devices_online||0}<span class="muted" style="font-size:12px">/${su.devices_total||0}</span></div><div class="t">Equipos</div></div>
              <div class="m"><div class="n" style="color:${warn?'var(--amber)':'var(--ink)'}">${su.alerts||0}</div><div class="t">Alertas</div></div>
              <div class="m"><div class="n" style="color:${bad?'var(--red)':'var(--ink)'}">${su.criticals_down||0}</div><div class="t">Críticos</div></div>
            </div></button>`;
      });
      h+='</div>';
    }
  }catch(e){}

  if(d.correlations&&d.correlations.length){
    h+=`<div class="section-t">Causas comunes <span class="cnt">${d.correlations.length}</span></div>`;
    d.correlations.forEach(x=>{ const col=sevColor(x.severity); const inf=x.confidence==='inferred';
      h+=`<div class="corr" style="border-color:${col}55">
        <div class="h"><b>${esc(x.title)}</b>
          <span class="badge" style="color:${inf?'var(--amber)':'var(--red)'};border-color:${inf?'var(--amber)':'var(--red)'};background:${inf?'#f5b64222':'#f2555a22'}">${inf?'POSIBLE':'CONFIRMADO'}</span></div>
        <p>${esc(x.detail)}</p>
        <div class="chips">${(x.sites||[]).map(s=>`<span class="chip"><span class="dot" style="background:${col}"></span>${esc(s.site_name)}</span>`).join('')}</div>
        ${x.recommendation?`<div class="reco">💡 ${esc(x.recommendation)}</div>`:''}</div>`;
    });
  }
  if(d.attention&&d.attention.length){
    h+=`<div class="section-t">Necesitan atención <span class="cnt">${d.attention.length}</span></div>`;
    d.attention.forEach(a=>{ const col=sevColor(a.severity);
      h+=`<div class="atn"><div class="bar" style="background:${col}"></div>
        <div><b>${esc(a.site_name)}</b><p>${(a.reasons||[]).map(esc).join(' · ')}</p></div></div>`;
    });
  }
  if(ok) h+=`<div class="section-t">Estado</div><div class="empty">Toda tu flota está en orden — ${s.sites_total||0} sede(s) vigiladas, sin causas comunes ni sedes que atender.</div>`;
  c.innerHTML=h;
  bindCopilot();
}

function copilotHTML(){
  return `<div class="copilot">
    <div class="ct">
      <span class="ai"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#04141a" stroke-width="2.2"><path d="M12 3a5 5 0 0 0-5 5c0 2 1 3 1 5h8c0-2 1-3 1-5a5 5 0 0 0-5-5zM9 20h6M10 22h4"/></svg></span>
      <h3>Copiloto de Flota</h3><span class="tag">IA · ACTÚA</span>
    </div>

    <div class="cbar">
      <input id="cpIn" type="text" placeholder="Ej.: bloquea la Samsung en todas las sedes" autocomplete="off">
      <button class="go" id="cpGo"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg> Analizar</button>

    <div class="cout" id="cpOut"></div>
  </div>`;
}
function bindCopilot(){
  const inp=document.getElementById('cpIn'); if(!inp) return;
  const run=()=>copilotAnalyze(inp.value.trim());
  document.getElementById('cpGo').onclick=run;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });
  document.querySelectorAll('.csug .s').forEach(b=>b.onclick=()=>{ inp.value=b.dataset.c; inp.focus(); });
}
async function copilotAnalyze(text){
  const out=document.getElementById('cpOut'); if(!out) return;
  if(!text){ out.innerHTML=''; _copilotPending=false; return; }
  out.innerHTML='<div class="cnote">🤔 Analizando tu orden…</div>';
  let d; try{ d=await apiPost('/v1/fleet/plan',{text}); }
  catch(e){ out.innerHTML=`<div class="cnote bad">No pude procesar la orden. ${esc(e.message||'')}</div>`; return; }
  if(!d.ok){
    let extra='';
    if(d.reason==='ambiguous' && d.candidates){
      extra=`<div class="cand">`+d.candidates.map(cnd=>
        `<button class="c" data-mac="${esc(cnd.mac)}" data-nm="${esc(cnd.name)}">${esc(cnd.name)} · <span class="muted">${esc(cnd.mac)}</span> · ${cnd.site_count} sede(s)</button>`
      ).join('')+`</div>`;
    }
    out.innerHTML=`<div class="cnote warn">💬 ${esc(d.message||'No entendí la orden.')}</div>${extra}`;
    _copilotPending=false;
    if(d.candidates){ const cur=document.getElementById('cpIn').value.replace(/\s+en\s+.*$/i,'');
      out.querySelectorAll('.cand .c').forEach(b=>b.onclick=()=>copilotAnalyze(`${cur} ${b.dataset.mac}`)); }
    return;
  }
  _copilotPending=true;
  const eligibleSites=d.sites.filter(s=>s.eligible);
  const actCls={block:'',trust:'trust',unblock:'unblock'}[d.action]||'';
  const rows=d.sites.map(s=>`<div class="psite">
      <span class="dot" style="background:${s.eligible?'var(--green)':'var(--muted2)'}"></span>
      <span class="nm">${esc(s.site_name)}</span>
      <span class="rs ${s.eligible?'ok':'no'}">${s.eligible?'lista':esc(s.reason||'no elegible')}</span>
    </div>`).join('');
  out.innerHTML=`<div class="prop">
      <div class="ph"><span class="act">${esc(d.action_label)}</span> → <span class="dev">${esc(d.device.name)}</span></div>
      <div class="pmeta">MAC ${esc(d.device.mac)} · aparece en ${d.sites.length} sede(s) · <b>${d.eligible_count}</b> lista(s) para actuar</div>
      ${rows}
      <div class="pact">
        <button class="exec ${actCls}" id="cpExec" ${d.eligible_count?'':'disabled'}>${d.eligible_count?`Ejecutar en ${d.eligible_count} sede(s)`:'Nada que ejecutar'}</button>
        <button class="cancel" id="cpCancel">Cancelar</button>
      </div></div>`;
  document.getElementById('cpCancel').onclick=()=>{ out.innerHTML=''; _copilotPending=false; };
  const eb=document.getElementById('cpExec');
  if(d.eligible_count){ eb.onclick=async()=>{
    eb.disabled=true; eb.textContent='Ejecutando…';
    try{
      const r=await apiPost('/v1/fleet/act',{action:d.action, mac:d.device.mac,
        site_ids:eligibleSites.map(s=>s.site_id), confirmed:true});
      const okc=r.queued_count||0;
      out.innerHTML=`<div class="cnote"><span>✅</span><div><b>${esc(d.action_label)} «${esc(d.device.name)}» encolado en ${okc} sede(s).</b>
        <div class="muted" style="margin-top:6px">${(r.results||[]).map(x=>`${esc(x.site_name||x.site_id)}: ${x.queued?'✓ en cola':'✕ '+esc(x.reason||'')}`).join(' · ')}</div>
        <div class="muted" style="margin-top:6px;font-size:11.5px">Cada sede aplica la orden cuando su agente sincroniza (segundos).</div></div></div>`;
      toast(`Orden enviada a ${okc} sede(s)`);
      _copilotPending=false; document.getElementById('cpIn').value='';
    }catch(e){
      const msg=e.status===402?'Requiere plan Pro para controlar a distancia.':e.status===403?'Tu rol no puede ejecutar esta acción a distancia.':(e.message||'Error');
      out.innerHTML=`<div class="cnote bad">No se pudo ejecutar. ${esc(msg)}</div>`;
      _copilotPending=false;
    }
  }; }
}

/* ============ EQUIPOS (ver + controlar dispositivos de tus redes) ============ */
let _devSite=null, _devQuery='', _devFilter='all', _devSel=new Set();
function fmtBpsShort(b){ if(b==null) return null; return fmtBps(b); }
function deviceEmoji(d){ const s=((d.name||'')+' '+(d.vendor||'')+' '+(d.device_type||'')).toLowerCase();
  if(/\btv\b|roku|chromecast|firestick|smart\s?tv|televi/.test(s))return'📺';
  if(/cam|c[aá]mara|hikvision|dahua|\bnvr\b/.test(s))return'📷';
  if(/router|gateway|modem|m[oó]dem|tp-?link|mikrotik|ubiquiti|arris|access point/.test(s))return'📶';
  if(/printer|impres|epson|canon|brother/.test(s))return'🖨️';
  if(/playstation|xbox|nintendo|console|consola/.test(s))return'🎮';
  if(/echo|alexa|google home|\bnest\b|speaker|bocina/.test(s))return'🔊';
  if(/iphone|galaxy|\bphone\b|android|xiaomi|redmi|m[oó]vil|celular/.test(s))return'📱';
  if(/mac|imac|laptop|port[aá]til|\bpc\b|desktop|windows|dell|lenovo|asus|acer/.test(s))return'💻';
  return'🔌'; }
const _TRUST_LABEL={trusted:'Confiable',blocked:'Bloqueado',unknown:'Sin clasificar'};
function _actMsg(a){ return {block:'Equipo bloqueado',unblock:'Equipo desbloqueado',trust:'Equipo marcado de confianza',rename:'Equipo renombrado'}[a]||'Orden enviada'; }
function devActions(d){ const blocked=d.trust==='blocked'; let a='';
  a+= blocked ? `<button class="dvbtn trust" data-act="unblock">Desbloquear</button>`
             : `<button class="dvbtn block" data-act="block">Bloquear</button>`;
  if(d.trust!=='trusted') a+=`<button class="dvbtn trust" data-act="trust">Confiar</button>`;
  a+=`<button class="dvbtn" data-act="rename">Renombrar</button>`; return a; }
function devRow(d, canAct){ const trust=d.trust||'unknown'; const mac=d.mac||'';
  const sel=_devSel.has(mac);
  return `<div class="dev" data-mac="${esc(mac)}">
    ${canAct?`<input type="checkbox" class="dvsel" data-mac="${esc(mac)}" ${sel?'checked':''} title="Seleccionar">`:''}
    <div class="ava dvopen" data-mac="${esc(mac)}">${deviceEmoji(d)}<span class="ol" style="background:${d.online?'var(--green)':'var(--muted2)'}"></span></div>
    <div class="meta dvopen" data-mac="${esc(mac)}"><div class="nm">${esc(d.name||mac||'Equipo')}${d.is_critical?' <span class="crit">CRÍTICO</span>':''}</div>
      <div class="sub">${esc(d.vendor||'—')} · ${esc(d.ip||'—')} · ${esc((mac||'—').toUpperCase())}</div></div>
    <span class="tpill ${trust}">${_TRUST_LABEL[trust]}</span>
    <div class="acts">${canAct?devActions(d):'<span class="muted" style="font-size:12px">solo lectura</span>'}</div></div>`; }
function exportDevicesCsv(list, siteName){
  const H=['Nombre','IP','MAC','Fabricante','Estado','Clasificación','Crítico'];
  const rows=[H].concat(list.map(d=>[d.name||'',d.ip||'',(d.mac||'').toUpperCase(),d.vendor||'',
    d.online?'En línea':'Desconectado',_TRUST_LABEL[d.trust||'unknown']||'',d.is_critical?'Sí':'No']));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`equipos_${String(siteName||'red').replace(/[^\w]+/g,'_')}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},600);
  toast('CSV exportado');
}
function _devErr(e){ return e.status===402?'Requiere plan Pro para controlar equipos.':e.status===403?'Tu rol no permite esta acción.':(e.message||'No se pudo'); }
// Ficha de equipo reutilizable (Equipos y Mapa). onChanged(act,value) para refrescar.
function openDeviceModal(d, siteId, canAct, onChanged){
  const mac=d.mac||''; const trust=d.trust||'unknown';
  const cons=d.bytes_per_sec!=null?((d.consumption_estimated?'~':'')+fmtBps(d.bytes_per_sec)):null;
  const row=(k,v)=>v?`<div class="mrow"><span class="k">${k}</span><span class="v">${v}</span></div>`:'';
  const ov=document.createElement('div'); ov.className='modal';
  ov.innerHTML=`<div class="modalcard">
    <div class="mch"><div class="ava">${deviceEmoji(d)}<span class="ol" style="background:${d.online?'var(--green)':'var(--muted2)'}"></span></div>
      <div><div class="nm">${esc(d.name||mac||'Equipo')}</div><div class="muted" style="font-size:12px">${esc(d.vendor||'Fabricante desconocido')}</div></div>
      <button class="close" aria-label="Cerrar">×</button></div>
    <div class="mbody">
      ${row('Estado', d.online?'<span style="color:var(--green)">● En línea</span>':'<span class="muted">○ Desconectado</span>')}
      ${row('Clasificación', `<span class="tpill ${trust}">${_TRUST_LABEL[trust]}</span>`)}
      ${row('Crítico', d.is_critical?'<span class="crit">SÍ</span>':'No')}
      ${row('Dirección IP', esc(d.ip||'—'))}
      ${row('MAC', esc((mac||'—').toUpperCase()))}
      ${row('Fabricante', esc(d.vendor||'—'))}
      ${row('Responsable', esc(d.owner||'— (sin asignar)'))}
      ${row('Área / Zona', esc(d.area||'—'))}
      ${row('Consumo ahora', cons?esc(cons):'—')}
    </div>
    ${canAct?`<div class="macts">
      ${trust==='blocked'?'<button class="dvbtn trust" data-m="unblock">Desbloquear</button>':'<button class="dvbtn block" data-m="block">Bloquear</button>'}
      ${trust!=='trusted'?'<button class="dvbtn trust" data-m="trust">Confiar</button>':''}
      <button class="dvbtn" data-m="rename">Renombrar</button>
      <button class="dvbtn" data-m="set_owner">Responsable</button>
    </div>`:'<div class="macts"><span class="muted" style="font-size:12.5px">Solo lectura (sin admin remota o sin plan Pro).</span></div>'}
  </div>`;
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  ov.querySelector('.close').onclick=close;
  ov.querySelectorAll('.macts .dvbtn').forEach(b=>b.onclick=async()=>{
    const act=b.dataset.m; let value=null;
    if(act==='rename'){ value=prompt('Nuevo nombre para este equipo:', d.name||''); if(value===null)return; value=value.trim(); if(!value)return; }
    if(act==='set_owner'){ value=prompt('¿Quién es el responsable de este equipo?', d.owner||''); if(value===null)return; value=value.trim(); }
    b.disabled=true; const old=b.textContent; b.textContent='…';
    try{ await apiPost('/v1/sites/'+encodeURIComponent(siteId)+'/commands',{action:act,mac,value});
      toast(_actMsg(act)+' — se aplica al sincronizar'); close(); onChanged&&onChanged(act,value); }
    catch(e){ toast(_devErr(e),true); b.disabled=false; b.textContent=old; }
  });
  document.body.appendChild(ov);
}
async function renderDevices(c){
  const sd = await api('/v1/sites'); const sites=sd.sites||[];
  if(!sites.length){ c.innerHTML='<div class="empty">Aún no tienes redes vinculadas. Vincula una desde la app RedProtec y aquí verás todos sus equipos.</div>'; return; }
  if(!_devSite || !sites.find(s=>s.site_id===_devSite)) _devSite=sites[0].site_id;
  const detail = await api('/v1/sites/'+encodeURIComponent(_devSite));
  const devices = detail.devices||[];
  const site = sites.find(s=>s.site_id===_devSite)||{};
  const canAct = !!detail.can_command && !!detail.remote_admin;
  // podar selección: solo equipos que siguen presentes
  const _macset=new Set(devices.map(d=>d.mac||'')); [..._devSel].forEach(m=>{ if(!_macset.has(m)) _devSel.delete(m); });

  let h='';
  if(sites.length>1){
    h+='<div class="dvtabs">'+sites.map(s=>`<button class="dvtab ${s.site_id===_devSite?'active':''}" data-site="${esc(s.site_id)}"><span class="d" style="background:${s.online?'var(--green)':'var(--muted2)'}"></span>${esc(s.site_name)}</button>`).join('')+'</div>';
  }
  if(!detail.remote_admin) h+='<div class="dvnote">⚠️ <div>Esta red no tiene <b>administración remota</b> activada: puedes ver los equipos pero no controlarlos desde aquí. Actívala en el agente de esa red.</div></div>';
  else if(!detail.can_command) h+='<div class="dvnote">🔒 <div>Tu plan/rol permite ver los equipos pero no controlarlos a distancia. Para bloquear o confiar necesitas plan Pro.</div></div>';
  h+=`<div class="dvtools">
      <input class="dvsearch" id="devSearch" placeholder="Buscar por nombre, IP, MAC o fabricante…" value="${esc(_devQuery)}">
      <button class="expbtn" id="devExport"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg> Exportar CSV</button>
    </div>
    <div class="dvchips" id="devChips"></div>
    <div id="devSummary" style="margin:14px 0"></div>
    <div id="devBulk"></div>
    <div id="devList"></div>`;
  c.innerHTML=h;

  c.querySelectorAll('.dvtab').forEach(b=>b.onclick=()=>{ _devSite=b.dataset.site; _devQuery=''; _devFilter='all'; _devSel.clear(); load(); });

  const FILTERS=[['all','Todos'],['online','En línea'],['blocked','Bloqueados'],['trusted','Confiables'],['unknown','Sin clasificar'],['critical','Críticos']];
  const counts=()=>({ all:devices.length, online:devices.filter(d=>d.online).length,
    blocked:devices.filter(d=>d.trust==='blocked').length, trusted:devices.filter(d=>d.trust==='trusted').length,
    unknown:devices.filter(d=>(d.trust||'unknown')==='unknown').length, critical:devices.filter(d=>d.is_critical).length });
  function match(d){
    if(_devFilter==='online'&&!d.online)return false;
    if(_devFilter==='blocked'&&d.trust!=='blocked')return false;
    if(_devFilter==='trusted'&&d.trust!=='trusted')return false;
    if(_devFilter==='unknown'&&(d.trust||'unknown')!=='unknown')return false;
    if(_devFilter==='critical'&&!d.is_critical)return false;
    const q=_devQuery.trim().toLowerCase(); if(!q)return true;
    return [d.name,d.ip,d.mac,d.vendor,d.hostname].some(x=>String(x||'').toLowerCase().includes(q));
  }
  function paintSummary(){ const ct=counts();
    document.getElementById('devSummary').innerHTML=`<div class="stats">
      ${stat(ct.all,'Equipos','var(--cyan)')}${stat(ct.online,'En línea','var(--green)')}
      ${stat(ct.blocked,'Bloqueados',ct.blocked?'var(--red)':'var(--muted)')}
      ${stat(ct.unknown,'Sin clasificar',ct.unknown?'#ff9f45':'var(--muted)')}
      ${stat(ct.critical,'Críticos',ct.critical?'var(--amber)':'var(--muted)')}</div>`; }
  function paintChips(){ const ct=counts();
    document.getElementById('devChips').innerHTML=FILTERS.map(([k,l])=>`<button class="dvchip ${_devFilter===k?'active':''}" data-f="${k}">${l} <span class="muted">${ct[k]}</span></button>`).join('');
    document.querySelectorAll('#devChips .dvchip').forEach(b=>b.onclick=()=>{ _devFilter=b.dataset.f; paintChips(); paintList(); }); }
  function applyLocal(dev,act,value){ if(act==='block')dev.trust='blocked'; else if(act==='unblock')dev.trust='unknown';
    else if(act==='trust')dev.trust='trusted'; else if(act==='rename')dev.name=value; else if(act==='set_owner')dev.owner=value; }
  function errMsg(e){ return e.status===402?'Requiere plan Pro para controlar equipos.':e.status===403?'Tu rol no permite esta acción.':(e.message||'No se pudo'); }
  async function sendCmd(mac,act,value){
    await apiPost('/v1/sites/'+encodeURIComponent(_devSite)+'/commands',{action:act,mac,value});
    const dev=devices.find(x=>(x.mac||'')===mac); if(dev) applyLocal(dev,act,value); return true; }
  function repaint(){ paintSummary(); paintChips(); paintBulk(); paintList(); }

  function paintBulk(){ const el=document.getElementById('devBulk'); if(!el) return;
    const n=_devSel.size; if(!n){ el.innerHTML=''; return; }
    el.innerHTML=`<div class="dvbulk"><b>${n}</b> seleccionado(s) <span class="sp"></span>
      <button class="bk" data-b="block">Bloquear</button>
      <button class="tr" data-b="trust">Confiar</button>
      <button class="ub" data-b="unblock">Desbloquear</button>
      <button class="cl" data-b="clear">Limpiar</button></div>`;
    el.querySelectorAll('.dvbulk button').forEach(b=>b.onclick=()=>bulkAct(b.dataset.b)); }
  async function bulkAct(act){
    if(act==='clear'){ _devSel.clear(); repaint(); return; }
    const macs=[..._devSel]; let ok=0,fail=0;
    for(const mac of macs){ try{ await sendCmd(mac,act,null); ok++; }catch(e){ fail++; if(e.status===402||e.status===403){ toast(errMsg(e),true); break; } } }
    _devSel.clear();
    toast(`${_actMsg(act)}: ${ok} equipo(s)`+(fail?` · ${fail} fallaron`:'')+' — se aplica al sincronizar', fail>0);
    repaint(); }

  function openModal(mac){ const d=devices.find(x=>(x.mac||'')===mac); if(!d) return;
    openDeviceModal(d,_devSite,canAct,(act,value)=>{ applyLocal(d,act,value); repaint(); }); }

  function bindRows(cont){
    cont.querySelectorAll('.dev .dvbtn').forEach(b=>b.onclick=async()=>{
      const mac=b.closest('.dev').dataset.mac, act=b.dataset.act;
      const dev=devices.find(x=>(x.mac||'')===mac)||{}; let value=null;
      if(act==='rename'){ value=prompt('Nuevo nombre para este equipo:', dev.name||''); if(value===null)return; value=value.trim(); if(!value)return; }
      b.disabled=true; const old=b.textContent; b.textContent='…';
      try{ await sendCmd(mac,act,value); toast(_actMsg(act)+' — se aplica cuando el agente sincronice'); repaint(); }
      catch(e){ toast(errMsg(e),true); b.disabled=false; b.textContent=old; }
    });
    cont.querySelectorAll('.dvsel').forEach(ch=>ch.onchange=()=>{ const m=ch.dataset.mac;
      if(ch.checked)_devSel.add(m); else _devSel.delete(m); paintBulk(); });
    cont.querySelectorAll('.dvopen').forEach(el=>el.onclick=()=>openModal(el.dataset.mac));
  }
  function paintList(){ const list=devices.filter(match); const cont=document.getElementById('devList');
    if(!list.length){ cont.innerHTML='<div class="empty">Sin equipos que coincidan con el filtro/búsqueda.</div>'; return; }
    cont.innerHTML=list.map(d=>devRow(d,canAct)).join(''); bindRows(cont); }

  paintSummary(); paintChips(); paintBulk(); paintList();
  document.getElementById('devSearch').oninput=(e)=>{ _devQuery=e.target.value; paintList(); };
  document.getElementById('devExport').onclick=()=>exportDevicesCsv(devices.filter(match), site.site_name);
}

/* ============ MAPA DE RED (topología en vivo) ============ */
const _MC={green:'#34d399',amber:'#f5b642',red:'#f2555a',grey:'#5f7a94',cyan:'#22d3ee',line:'#243347',ink:'#eaf6ff',muted:'#8ea6bf'};
function nodeColor(d){ if(!d.online)return _MC.grey; const t=d.trust||'unknown';
  return t==='blocked'?_MC.red:t==='trusted'?_MC.green:_MC.amber; }
function findGateway(devs){ return devs.find(d=>/router|gateway|modem|m[oó]dem|puerta de enlace/i.test((d.name||'')+' '+(d.vendor||'')))
    || devs.find(d=>/\.1$/.test(d.ip||'')) || null; }
function clipTxt(s,n){ s=String(s||''); return s.length>n?s.slice(0,n-1)+'…':s; }
function mapLayout(n){ const pos=[]; let idx=0, ring=1;
  while(idx<n){ const radius=ring*118; const cap=Math.max(1,Math.floor(2*Math.PI*radius/96));
    const take=Math.min(cap,n-idx); const off=(ring%2)?0:Math.PI/take;
    for(let i=0;i<take;i++){ const a=(2*Math.PI*i/take)-Math.PI/2+off; pos.push({x:Math.cos(a)*radius,y:Math.sin(a)*radius}); }
    idx+=take; ring++; }
  return {pos, rings:ring-1}; }
async function renderMap(c){

  if(!devices.length){ h+='<div class="empty">Esta red no tiene inventario de equipos. Activa «Inventario completo» en el agente para ver el mapa.</div>';
    c.innerHTML=h; c.querySelectorAll('.dvtab').forEach(b=>b.onclick=()=>{_devSite=b.dataset.site;load();}); return; }

  const gw=findGateway(devices); const nodes=devices.filter(d=>d!==gw);
  const {pos,rings}=mapLayout(nodes.length);
  const maxR=(rings||1)*118, pad=78, size=2*(maxR+pad), cx=size/2, cy=size/2;
  let svg=`<svg viewBox="0 0 ${size} ${size}" preserveAspectRatio="xMidYMid meet">
    <defs><radialGradient id="hubg" cx="50%" cy="45%"><stop offset="0" stop-color="#16324a"/><stop offset="1" stop-color="#0b1420"/></radialGradient></defs>
    <g stroke="${_MC.line}" stroke-width="1.5">`;
  pos.forEach(p=>{ svg+=`<line x1="${cx}" y1="${cy}" x2="${(cx+p.x).toFixed(1)}" y2="${(cy+p.y).toFixed(1)}"/>`; });
  svg+='</g>';
  nodes.forEach((d,i)=>{ const p=pos[i], x=(cx+p.x), y=(cy+p.y), col=nodeColor(d);
    svg+=`<g class="mapnode" data-mac="${esc(d.mac||'')}">
      ${d.is_critical?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="31" fill="none" stroke="${_MC.amber}" stroke-width="2" stroke-dasharray="3 4"/>`:''}
      <circle class="bg" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="24" fill="#111a27" stroke="${col}" stroke-width="3"/>
      <text x="${x.toFixed(1)}" y="${(y+7).toFixed(1)}" text-anchor="middle" font-size="21">${deviceEmoji(d)}</text>
      <text x="${x.toFixed(1)}" y="${(y+43).toFixed(1)}" text-anchor="middle" font-size="12.5" fill="${_MC.muted}">${esc(clipTxt(d.name||d.mac,13))}</text></g>`;
  });
  const hubEmoji=gw?deviceEmoji(gw):'📶', hubName=gw?(gw.name||'Router'):'Router';
  svg+=`<g class="mapnode" ${gw?`data-mac="${esc(gw.mac||'')}"`:''}>
    <circle cx="${cx}" cy="${cy}" r="36" fill="url(#hubg)" stroke="${_MC.cyan}" stroke-width="2.5"/>
    <text x="${cx}" y="${cy+8}" text-anchor="middle" font-size="28">${hubEmoji}</text>
    <text x="${cx}" y="${cy+56}" text-anchor="middle" font-size="13" fill="${_MC.ink}" font-weight="700">${esc(clipTxt(hubName,16))}</text></g></svg>`;

  h+=`<div class="mapwrap">${svg}</div>
    <div class="maplegend">
      <span class="lg"><span class="d" style="background:${_MC.green}"></span>Confiable</span>
      <span class="lg"><span class="d" style="background:${_MC.amber}"></span>Sin clasificar</span>
      <span class="lg"><span class="d" style="background:${_MC.red}"></span>Bloqueado</span>
      <span class="lg"><span class="d" style="background:${_MC.grey}"></span>Desconectado</span>
      <span class="lg"><span class="d" style="border:2px dashed ${_MC.amber}"></span>Crítico</span>
    </div>
    <p class="muted" style="font-size:11.5px;margin-top:10px">Topología lógica de «${esc(site.site_name||'tu red')}» — ${nodes.length+(gw?1:0)} equipo(s) alrededor del router. Toca cualquiera para ver su ficha y controlarlo.</p>`;
  c.innerHTML=h;
  c.querySelectorAll('.dvtab').forEach(b=>b.onclick=()=>{ _devSite=b.dataset.site; load(); });
  c.querySelectorAll('.mapnode').forEach(g=>{ const mac=g.dataset.mac; if(!mac)return;
    g.onclick=()=>{ const d=devices.find(x=>(x.mac||'')===mac); if(d) openDeviceModal(d,_devSite,canAct,()=>load()); }; });

/* ============ SALA DE GUERRA (NOC en vivo) ============ */
function fmtDur(s){ s=Math.max(0,Math.floor(+s||0));
  const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(d) return `${d}d ${h}h`; if(h) return `${h}h ${m}m`; if(m) return `${m}m`; return `${s}s`; }
function fmtAgo(iso){ if(!iso) return ''; const t=Date.parse(iso); if(isNaN(t)) return '';
  const s=Math.max(0,Math.floor((Date.now()-t)/1000));
  if(s<60) return 'hace '+s+'s'; if(s<3600) return 'hace '+Math.floor(s/60)+'m';
  if(s<86400) return 'hace '+Math.floor(s/3600)+'h'; return 'hace '+Math.floor(s/86400)+'d'; }
function gauge(pct,col){ pct=Math.max(0,Math.min(100,+pct||0)); const r=64,C=2*Math.PI*r;
  const off=C*(1-pct/100);
  return `<div class="gauge"><svg width="150" height="150" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--line2)" stroke-width="12"/>
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
  </svg><div class="gv"><div class="p" style="color:${col}">${pct}%</div><div class="s">Disponible</div></div></div>`; }
const pctColor=p=>p>=99?'var(--green)':p>=95?'var(--cyan)':p>=90?'var(--amber)':'var(--red)';

const AUDIT_ICON={block:'🚫',unblock:'✅',trust:'🛡️',incident_ack:'📟','fleet:block':'🚫','fleet:unblock':'✅','fleet:trust':'🛡️','fleet:policy':'📋'};
const AUDIT_VERB={block:'bloqueó',unblock:'desbloqueó',trust:'marcó de confianza',incident_ack:'confirmó el incidente',
  'fleet:block':'bloqueó','fleet:unblock':'desbloqueó','fleet:trust':'marcó de confianza','fleet:policy':'actualizó la política de la flota'};
function auditVerb(a){ return AUDIT_VERB[a]||String(a||'').replace(/[:_]/g,' '); }
function friendlyActor(a){ const k=String(a||'').toLowerCase();
  return {owner:'El dueño',master:'El dueño',admin:'Un administrador',manager:'Un gerente',auditor:'Un auditor',
    partner:'El socio',viewer:'Un observador','?':'Alguien','':'Alguien'}[k] || (a.charAt(0).toUpperCase()+a.slice(1)); }
const _isUuid=s=>/^[0-9a-f]{32}$/i.test(String(s||''))||/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(String(s||''));
const _isMac=s=>/^([0-9a-f]{2}[:-]){5}[0-9a-f]{2}$/i.test(String(s||''));
// Describe una entrada de bitácora en lenguaje natural (sin códigos crudos).
function describeAudit(e, siteNames){
  const role=friendlyActor(e.actor), a=String(e.action||''), verb=auditVerb(a);
  let tgt='';
  const t=e.target;
  if(t && t!=='-'){
    if(_isUuid(t)) tgt = siteNames[t] ? ' en «'+siteNames[t]+'»' : ' en una sede';
    else if(_isMac(t)) tgt = ' un equipo';
    else tgt = ' «'+t+'»';
  }
  let extra=''; const m=/en\s+(\d+)\s+sede/i.exec(e.detail||''); if(m) extra=' · en '+m[1]+' sede(s)';
  return {icon:AUDIT_ICON[a]||'•', html:`<span class="who">${esc(role)}</span> ${esc(verb)}${esc(tgt)}${esc(extra)}`};
}

async function renderWarRoom(c){
  const R = await Promise.allSettled([
    api('/v1/availability'), api('/v1/incidents'), api('/v1/sla?days=30'),
    api('/v1/insights'), api('/v1/audit?limit=40'),
  ]);
  const av = R[0].status==='fulfilled'?R[0].value:null;
  const inc = R[1].status==='fulfilled'?R[1].value:{incidents:[]};
  const sla = R[2].status==='fulfilled'?R[2].value:null;
  const ins = R[3].status==='fulfilled'?R[3].value:{roaming_unknowns:[]};
  const aud = R[4].status==='fulfilled'?R[4].value:{entries:[]};

  const openInc=(inc.incidents||[]).filter(x=>!x.acked).length;
  _nav.war=openInc||0; buildNav();

  const avs=(av&&av.summary)||{}; const pct=avs.availability_pct!=null?avs.availability_pct:100;
  const col=pctColor(pct);
  const up30 = sla&&sla.overall?sla.overall.uptime_pct:null;

  // ── hero ──
  let h=`<div class="warhero">
    ${gauge(pct,col)}
    <div class="warhead">
      <div class="k">Centro de operaciones · en vivo</div>
      <h3>${openInc?`${openInc} incidente(s) abierto(s) · atención`:'Flota estable · sin incidentes abiertos'}</h3>
      <div class="mini">
        <div class="m"><div class="n" style="color:${avs.sites_online<avs.sites?'var(--red)':'var(--green)'}">${avs.sites_online||0}/${avs.sites||0}</div><div class="t">Sedes en línea</div></div>
        <div class="m"><div class="n" style="color:${avs.criticals_down?'var(--red)':'var(--ink)'}">${avs.criticals_up||0}/${avs.criticals_total||0}</div><div class="t">Críticos arriba</div></div>
        <div class="m"><div class="n" style="color:${openInc?'var(--red)':'var(--green)'}">${openInc}</div><div class="t">Incidentes abiertos</div></div>
        ${up30!=null?`<div class="m"><div class="n" style="color:${pctColor(up30)}">${up30}%</div><div class="t">Uptime 30 días</div></div>`:''}
      </div>
    </div>
    <button class="fsbtn" id="fsBtn"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg> Pantalla completa</button>
  </div>`;

  // ── incidentes on-call ──
  h+=`<div class="section-t">Incidentes on-call${openInc?` <span class="cnt">${openInc}</span>`:''}</div>`;
  const incs=inc.incidents||[];
  if(!incs.length){ h+=`<div class="empty">Sin incidentes abiertos — ninguna sede caída ahora mismo. 🟢</div>`; }
  else{
    incs.forEach(x=>{ const esc_=esc(x.site_name); const acked=x.acked;
      h+=`<div class="inc ${acked?'acked':''}" data-site="${esc(x.site_id)}">
        <span class="beat"></span>
        <div class="ib"><b>${esc_}</b><p>Caída ${fmtAgo(x.down_since)} · lleva ${fmtDur(x.down_seconds)} fuera${x.escalation_level?` · escalado nivel ${x.escalation_level}`:''}</p></div>
        ${x.escalation_level?`<span class="esc">ESC ${x.escalation_level}</span>`:''}
        ${acked?`<span class="ackedlbl">✓ Enterado</span>`:`<button class="ack" data-site="${esc(x.site_id)}">Enterado</button>`}
      </div>`;
    });
  }

  // ── SLA / uptime 30 días ──
  if(sla && (sla.sites||[]).length){
    h+=`<div class="section-t">Uptime auditable · 30 días <span class="cnt">${sla.overall.uptime_pct}% global</span></div>`;
    const rows=sla.sites.map(s=>{ const uc=pctColor(s.uptime_pct);
      return `<tr class="slarow">
        <td><b>${esc(s.site_name)}</b></td>
        <td><div class="ub"><span class="updot" style="background:${uc}"></span><span class="num" style="color:${uc};font-weight:800">${s.uptime_pct}%</span></div></td>
        <td class="num" style="color:${s.incidents?'var(--amber)':'var(--muted)'}">${s.incidents||0}</td>
        <td class="num muted">${s.mttr_seconds?fmtDur(s.mttr_seconds):'—'}</td>
        <td class="num muted">${s.downtime_seconds?fmtDur(s.downtime_seconds):'0s'}</td></tr>`;
    }).join('');
    h+=`<div class="tscroll"><table><thead><tr><th>Sede</th><th>Uptime</th><th>Incidentes</th><th>MTTR</th><th>Caída total</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="muted" style="font-size:11.5px;margin-top:10px">Prueba auditable de disponibilidad de los últimos 30 días. MTTR = tiempo medio de recuperación.</p>`;
  }

  // ── intruso itinerante (multi-sede) ──
  const roam=ins.roaming_unknowns||[];
  if(roam.length){
    h+=`<div class="section-t">Intruso itinerante <span class="cnt">${roam.length}</span></div>`;
    roam.forEach(r=>{ h+=`<div class="atn"><div class="bar" style="background:var(--red)"></div>
      <div><b>${esc(r.name)}</b> <span class="muted">${esc(r.mac)}</span>
      <p>Equipo NO confiable visto en ${r.site_count} sedes: ${(r.sites||[]).map(esc).join(', ')}</p></div></div>`; });
    h+=`<p class="muted" style="font-size:11.5px;margin:2px 0 0">La misma MAC sin clasificar apareciendo en varias sedes — solo se detecta con visión multi-sede.</p>`;
  }

  // ── feed de operaciones (lenguaje humano, sin códigos, repetidos agrupados) ──
  const ents=aud.entries||[];
  if(ents.length){
    // mapa id-de-sede → nombre (de disponibilidad + incidentes) para no mostrar UUID
    const siteNames={};
    (av&&av.sites||[]).forEach(s=>{ if(s.site_id) siteNames[s.site_id]=s.site_name; });
    (inc.incidents||[]).forEach(s=>{ if(s.site_id) siteNames[s.site_id]=s.site_name; });
    // agrupar entradas consecutivas idénticas (p. ej. «actualizó la política» ×5)
    const items=[];
    ents.forEach(e=>{ const d=describeAudit(e,siteNames); const last=items[items.length-1];
      if(last && last.html===d.html){ last.count++; }
      else items.push({icon:d.icon, html:d.html, at:e.at, count:1}); });
    h+=`<div class="section-t">Feed de operaciones</div><div class="feed">`;
    items.forEach(it=>{ h+=`<div class="fi"><div class="ico">${it.icon}</div>
      <div class="tx">${it.html}${it.count>1?` <span class="det">· ${it.count} veces</span>`:''}</div>
      <div class="ago">${fmtAgo(it.at)}</div></div>`; });
    h+=`</div>`;
  }

  c.innerHTML=h;

  // fullscreen
  const fb=document.getElementById('fsBtn');
  if(fb) fb.onclick=()=>{ const el=document.getElementById('app');
    if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el); }
    else{ (document.exitFullscreen||document.webkitExitFullscreen||(()=>{})).call(document); } };

  // ack incidentes
  c.querySelectorAll('.ack').forEach(b=>b.onclick=async()=>{
    const sid=b.dataset.site; b.disabled=true; b.textContent='…';
    try{ await apiPost(`/v1/incidents/${encodeURIComponent(sid)}/ack`,{});
      toast('Incidente confirmado'); load(); }
    catch(e){ toast(e.status===403?'Sede fuera de tu alcance':(e.message||'No se pudo'),true);
      b.disabled=false; b.textContent='Enterado'; }
  });
}

/* ============ POLÍTICAS DE FLOTA (estándar + desvío) ============ */
const POL_ITEMS=[
  {k:'require_protection', t:'Protección activa', d:'Cada sede debe tener la protección encendida (no «apagada/desconocida»).', type:'bool'},
  {k:'require_no_criticals_down', t:'Sin críticos caídos', d:'Ningún activo crítico puede estar fuera de línea.', type:'bool'},
  {k:'require_remote_admin', t:'Admin remota', d:'Exigir que la administración remota esté encendida en cada sede.', type:'bool'},
  {k:'max_unmanaged', t:'Máx. sin gestionar', d:'Cuántos equipos sin clasificar se toleran por sede.', type:'num'},
];
async function renderPolicy(c){
  const d = await api('/v1/fleet/policy');
  const pol={...d.policy}; const canEdit=!!d.can_edit;

    }
    return `<div class="polrow"><div class="lab"><b>${it.t}</b><p>${it.d}</p></div>
      <input class="polnum" id="pol_${it.k}" type="number" min="0" value="${+pol[it.k]||0}" ${canEdit?'':'disabled'}></div>`;
  }).join('');

  const total=(d.sites||[]).length;

        <div><b>${esc(s.site_name)}</b> ${s.online?'':'<span class="muted">· sin conexión</span>'}

    okList.forEach(s=>{ siteHtml+=`<div class="polsite"><div class="bar" style="background:var(--green)"></div>
        <div><b>${esc(s.site_name)}</b> <span class="muted">· cumple</span></div></div>`; });
  }

  c.innerHTML=`<div class="polwrap">
    <div class="polcard">
      <h4>Estándar de la organización</h4>
      <p class="muted" style="font-size:12px;margin:2px 0 10px">${canEdit?'Defínelo una vez; el relay evalúa cada sede y marca el desvío.':'Solo el dueño/maestro puede editar el estándar.'}</p>
      ${editForm}
      ${canEdit?`<div class="savebar"><button class="btn" id="polSave">Guardar estándar</button><span class="muted" id="polMsg"></span></div>`:''}
    </div>
    <div><div class="section-t">Cumplimiento por sede</div>${siteHtml}</div>
  </div>`;

  if(canEdit){
    c.querySelectorAll('.sw').forEach(sw=>sw.onclick=()=>{ pol[sw.dataset.k]=!pol[sw.dataset.k]; sw.classList.toggle('on'); });
    document.getElementById('polSave').onclick=async()=>{
      const btn=document.getElementById('polSave'); btn.disabled=true; btn.textContent='Guardando…';
      const payload={
        require_protection:!!pol.require_protection,
        require_no_criticals_down:!!pol.require_no_criticals_down,
        require_remote_admin:!!pol.require_remote_admin,
        max_unmanaged:Math.max(0,parseInt(document.getElementById('pol_max_unmanaged').value)||0),
      };
      try{ await apiPut('/v1/fleet/policy',payload); toast('Estándar guardado'); load(); }
      catch(e){ toast(e.status===403?'Solo el dueño puede editar':'No se pudo guardar',true); btn.disabled=false; btn.textContent='Guardar estándar'; }
    };
  }
}

async function renderConsumption(c){
  const q = _price!=null?`?price_per_gb=${encodeURIComponent(_price)}`:'';
  const d = await api('/v1/fleet/consumption'+q); const sites=d.sites||[];
  let h=`<div class="priceRow">
    <span class="muted">Consumo de la flota ahora:</span> <b>${fmtBps(d.fleet_bytes_per_sec)}</b>

    <input id="price" type="number" step="0.01" min="0" placeholder="Precio por GB (opc.)" value="${_price!=null?_price:''}">
    <button class="btn" id="calc">Calcular</button></div>`;
  if(!sites.length){ h+='<div class="empty">Aún no hay datos de consumo. Activa el inventario completo (modo empresa) en tus sedes.</div>'; c.innerHTML=h; bindPrice(); return; }
  let rows=sites.map((s,i)=>`<tr>
      <td class="num">${i+1}</td>
      <td><b>${esc(s.site_name)}</b>${s.estimated?' <span class="muted">~</span>':''}</td>
      <td class="num">${fmtBps(s.bytes_per_sec)}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="barwrap"><div class="barfill" style="width:${Math.min(100,s.share_pct||0)}%"></div></div><span class="num muted">${s.share_pct||0}%</span></div></td>
      <td class="num muted">~${s.monthly_gb_est||0} GB</td>
      ${_price!=null?`<td class="num" style="color:var(--green)">~$${(s.monthly_cost_est||0).toFixed(2)}</td>`:''}
      <td class="muted">${esc(s.top?s.top.name:'—')}</td></tr>`).join('');
  h+=`<div class="tscroll"><table><thead><tr><th>#</th><th>Sede</th><th>Consumo</th><th>Participación</th><th>Est. mensual</th>${_price!=null?'<th>Costo est.</th>':''}<th>Mayor consumidor</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="font-size:11.5px;margin-top:12px">Consumo EN VIVO (algunos valores son estimados por categoría, con ~). La estimación mensual asume el ritmo actual.</p>`;
  c.innerHTML=h; bindPrice();
}
function bindPrice(){
  const b=document.getElementById('calc'); if(!b) return;
  b.onclick=()=>{ const v=parseFloat(document.getElementById('price').value); _price=(!isNaN(v)&&v>=0)?v:null; load(); };
}

// ---------- auto-refresh ----------
let _auto=false, _autoTimer=null;
function toggleAuto(){
  _auto=!_auto;
  const b=document.getElementById('autoBtn'); b.classList.toggle('on',_auto);
  if(_autoTimer){ clearInterval(_autoTimer); _autoTimer=null; }
  if(_auto){ _autoTimer=setInterval(()=>{
    // no interrumpir una propuesta del copiloto ni el editor de políticas
    if(current==='brief' && _copilotPending) return;
    if(current==='policy') return;
    if(document.hidden) return;
    load();
  }, 25000); }
}

// ---------- shell control ----------
function showApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('acct').textContent=store.email||'—';
  buildNav(); go('brief');
}
function showLogin(){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}
function logout(){ store.t=null; store.r=null; if(_autoTimer){clearInterval(_autoTimer);_autoTimer=null;} _auto=false; showLogin(); }
document.getElementById('logout').onclick=logout;
document.getElementById('refreshBtn').onclick=load;
document.getElementById('autoBtn').onclick=toggleAuto;
document.getElementById('menuBtn').onclick=(e)=>{ e.stopPropagation(); toggleMenu(); };
// cerrar el menú al tocar fuera
document.addEventListener('click',(e)=>{ const n=document.getElementById('nav');
  if(n&&n.classList.contains('open')&&!e.target.closest('.side')) closeMenu(); });

document.getElementById('loginForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const btn=document.getElementById('loginBtn'), err=document.getElementById('loginErr');
  err.textContent=''; btn.disabled=true; btn.textContent='Entrando…';
  try{
    await supaLogin(document.getElementById('email').value.trim(), document.getElementById('password').value);
    showApp();
  }catch(ex){ err.textContent=ex.message||'No se pudo entrar'; }
  finally{ btn.disabled=false; btn.textContent='Entrar'; }
});

// arranque: si hay token, valida entrando al panel (una llamada); si falla, login.
(async function(){
  if(store.t){
    try{ await api('/v1/sites'); showApp(); return; }catch(e){}
  }
  showLogin();
})();
</script>
</body>
</html>
