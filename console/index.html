<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedProtec · Consola</title>
<style>
  :root{
    --bg:#070b12; --bg2:#0b111b; --panel:#0e1520; --panel2:#111a27;
    --line:#1b2636; --line2:#243347;
    --ink:#eaf6ff; --muted:#8ea6bf; --muted2:#5f7a94;
    --cyan:#22d3ee; --green:#34d399; --amber:#f5b642; --red:#f2555a; --violet:#8ab4ff;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(900px 500px at 15% -5%, rgba(34,211,238,.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(52,211,153,.07), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; font-size:14px;
  }
  button{font:inherit;cursor:pointer}
  a{color:var(--cyan)}
  .hidden{display:none!important}

  /* ---------- LOGIN ---------- */
  #login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
  .login-card{width:min(94vw,400px);padding:34px 30px}
  .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:8px}
  .brand .wm{font-weight:800;letter-spacing:.14em;font-size:20px}
  .brand .wm .g{background:linear-gradient(120deg,var(--green),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .login-card h1{font-size:15px;font-weight:600;color:var(--muted);text-align:center;margin:2px 0 24px;letter-spacing:.02em}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;
    padding:12px 13px;color:var(--ink);font:inherit;outline:none}
  input:focus{border-color:var(--cyan)}
  .btn{width:100%;margin-top:22px;background:linear-gradient(120deg,var(--cyan),var(--green));
    color:#04141a;border:none;border-radius:11px;padding:13px;font-weight:800;letter-spacing:.02em}
  .btn:disabled{opacity:.6;cursor:default}
  .err{color:var(--red);font-size:12.5px;margin-top:14px;min-height:1em;text-align:center}
  .hint{color:var(--muted);font-size:11.5px;text-align:center;margin-top:18px;line-height:1.5}

  /* ---------- SHELL ---------- */
  #app{display:grid;grid-template-columns:242px 1fr;min-height:100vh}
  .side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh}
  .side .top{padding:22px 20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
  .side .wm{font-weight:800;letter-spacing:.12em;font-size:16px}
  .side .wm .g{background:linear-gradient(120deg,var(--green),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  nav{padding:14px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
  .navi{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;color:var(--muted);
    background:none;border:none;text-align:left;font-weight:600;transition:.15s}
  .navi svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9}
  .navi:hover{background:var(--panel);color:var(--ink)}
  .navi.active{background:rgba(34,211,238,.12);color:var(--cyan)}
  .side .foot{padding:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .side .foot .acct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
  .logout{width:100%;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:9px;padding:9px;font-weight:600}
  .logout:hover{border-color:var(--red);color:var(--red)}

  main{padding:26px 30px 60px;max-width:1180px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .topbar h2{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .refresh{background:var(--panel);border:1px solid var(--line2);color:var(--ink);border-radius:10px;padding:9px 15px;font-weight:600;display:flex;gap:8px;align-items:center}
  .refresh:hover{border-color:var(--cyan)}
  .refresh svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

  /* cards / grid */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .stat .v{font-size:26px;font-weight:900;line-height:1}
  .stat .l{color:var(--muted);font-size:12.5px;margin-top:7px}
  .hero{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line2);
    border-radius:16px;padding:22px 24px;margin-bottom:22px;display:flex;gap:16px;align-items:center}
  .hero .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
  .hero h3{margin:0;font-size:18px;font-weight:800;line-height:1.3}
  .hero .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}

  .section-t{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:26px 0 12px}
  .corr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .corr .h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .corr .h b{font-size:14.5px}
  .badge{font-size:10px;font-weight:900;letter-spacing:.05em;padding:3px 8px;border-radius:7px;border:1px solid}
  .corr p{margin:6px 0 0;color:var(--muted);line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--line2);
    background:var(--bg2);display:inline-flex;gap:5px;align-items:center}
  .reco{margin-top:10px;background:rgba(34,211,238,.07);border-radius:10px;padding:10px 12px;font-size:12.5px;display:flex;gap:8px}

  .atn{display:flex;align-items:flex-start;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:13px 15px;margin-bottom:10px}
  .atn .bar{width:4px;align-self:stretch;border-radius:2px;flex:0 0 auto}
  .atn b{font-size:14px}
  .atn p{margin:3px 0 0;color:var(--muted);font-size:12.5px}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;overflow:hidden}
  thead th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
    font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line)}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--panel2)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .num{font-variant-numeric:tabular-nums}
  .barwrap{height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;min-width:90px}
  .barfill{height:100%;background:var(--cyan)}
  .loading,.empty{color:var(--muted);padding:30px;text-align:center}
  .priceRow{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .priceRow input{width:170px}
  .priceRow .btn{width:auto;margin:0;padding:10px 18px}
  .muted{color:var(--muted)}
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="login">
  <div class="card login-card">
    <div class="brand">
      <span id="logo-login"></span>
      <span class="wm"><span class="g">RED</span>PROTEC</span>
    </div>
    <h1>Consola de operaciones</h1>
    <form id="loginForm" autocomplete="on">
      <label for="email">Correo</label>
      <input id="email" type="email" required placeholder="tucorreo@ejemplo.com">
      <label for="password">Contraseña</label>
      <input id="password" type="password" required placeholder="••••••••">
      <button class="btn" id="loginBtn" type="submit">Entrar</button>
      <div class="err" id="loginErr"></div>
    </form>
    <div class="hint">Entra con la misma cuenta de tu app RedProtec.<br>Ves tus sedes y tu flota, no la red local de este equipo.</div>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="top"><span id="logo-side"></span><span class="wm"><span class="g">RED</span>PROTEC</span></div>
    <nav id="nav"></nav>
    <div class="foot">
      <div class="acct" id="acct">—</div>
      <button class="logout" id="logout">Cerrar sesión</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div>
        <h2 id="viewTitle">Resumen</h2>
        <div class="sub" id="viewSub"></div>
      </div>
      <button class="refresh" id="refreshBtn">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg> Actualizar
      </button>
    </div>
    <div id="content"><div class="loading">Cargando…</div></div>
  </main>
</div>

<script>
const CFG = {
  SUPABASE_URL: "https://llxeahaxxdgtcvldqlwt.supabase.co",
  ANON: "sb_publishable_YTA2Tm2bqXVZKOF0KPXbbw_eE4f_L4k",
};
const LOGO_SVG = `<svg width="30" height="30" viewBox="0 0 512 512" fill="none">
  <defs><linearGradient id="e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="w" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#eafcff"/></linearGradient></defs>
  <path d="M256 100C210 100 150 108 116 120 106 123 100 130 100 142L100 262C100 356 168 414 256 448 344 414 412 356 412 262L412 142C412 130 406 123 396 120 362 108 302 100 256 100Z" fill="#0f2436" stroke="url(#e)" stroke-width="14"/>
  <g stroke="url(#w)" stroke-width="26" stroke-linecap="round"><path d="M182 296 Q256 200 330 296"/><path d="M206 310 Q256 244 306 310"/><path d="M228 324 Q256 286 284 324"/></g>
  <circle cx="256" cy="342" r="15" fill="#eafcff"/></svg>`;
document.getElementById('logo-login').innerHTML = LOGO_SVG;
document.getElementById('logo-side').innerHTML = LOGO_SVG;

// ---------- auth ----------
const store = {
  get t(){ try{return localStorage.getItem('rp_at')}catch(e){return null} },
  set t(v){ try{v?localStorage.setItem('rp_at',v):localStorage.removeItem('rp_at')}catch(e){} },
  get r(){ try{return localStorage.getItem('rp_rt')}catch(e){return null} },
  set r(v){ try{v?localStorage.setItem('rp_rt',v):localStorage.removeItem('rp_rt')}catch(e){} },
  get email(){ try{return localStorage.getItem('rp_em')||''}catch(e){return ''} },
  set email(v){ try{localStorage.setItem('rp_em',v||'')}catch(e){} },
};

async function supaLogin(email, password){
  const res = await fetch(`${CFG.SUPABASE_URL}/auth/v1/token?grant_type=password`,{
    method:'POST', headers:{'apikey':CFG.ANON,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  });
  const j = await res.json();
  if(!res.ok) throw new Error(j.error_description||j.msg||j.error||'Correo o contraseña incorrectos');
  store.t=j.access_token; store.r=j.refresh_token; store.email=email;
  return j;
}
async function supaRefresh(){
  if(!store.r) return false;
  const res = await fetch(`${CFG.SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
    method:'POST', headers:{'apikey':CFG.ANON,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:store.r})
  });
  if(!res.ok) return false;
  const j = await res.json();
  store.t=j.access_token; store.r=j.refresh_token; return true;
}
// relay API call (same-origin). Refresca 1 vez ante 401.
async function api(path, _retry){
  const res = await fetch(path,{headers:{'Authorization':`Bearer ${store.t}`}});
  if(res.status===401 && !_retry){ if(await supaRefresh()) return api(path,true); logout(); throw new Error('Sesión expirada'); }
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}

// ---------- views ----------
const VIEWS = [
  {id:'brief', title:'Cerebro de Flota', sub:'El parte único de toda tu flota', icon:'<path d="M12 3a5 5 0 0 0-5 5c0 2 1 3 1 5h8c0-2 1-3 1-5a5 5 0 0 0-5-5zM9 20h6M10 22h4"/>', render:renderBrief},
  {id:'sites', title:'Sedes', sub:'Todas tus redes/sedes', icon:'<path d="M4 21V8l8-5 8 5v13M9 21v-6h6v6"/>', render:renderSites},
  {id:'threats', title:'Amenazas', sub:'Correlacionadas entre sedes', icon:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/>', render:renderThreats},
  {id:'consumption', title:'Consumo', sub:'Quién consume más en tu flota', icon:'<path d="M3 3v18h18M8 15l3-4 3 3 4-6"/>', render:renderConsumption},
];
let current = 'brief';

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML='';
  VIEWS.forEach(v=>{
    const b=document.createElement('button');
    b.className='navi'+(v.id===current?' active':'');
    b.innerHTML=`<svg viewBox="0 0 24 24">${v.icon}</svg>${v.title}`;
    b.onclick=()=>go(v.id);
    nav.appendChild(b);
  });
}
function go(id){ current=id; buildNav(); const v=VIEWS.find(x=>x.id===id);
  document.getElementById('viewTitle').textContent=v.title;
  document.getElementById('viewSub').textContent=v.sub;
  load(); }
async function load(){
  const c=document.getElementById('content'); c.innerHTML='<div class="loading">Cargando…</div>';
  const v=VIEWS.find(x=>x.id===current);
  try{ await v.render(c); }
  catch(e){ c.innerHTML=`<div class="empty">No se pudo cargar. ${e.message||''}</div>`; }
}

const sevColor=s=>({critical:'var(--red)',high:'#ff9f45',medium:'var(--amber)',low:'var(--muted)'}[s]||'var(--cyan)');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function fmtBps(b){ b=+b||0; if(b>=1e6)return (b/1e6).toFixed(1)+' MB/s'; if(b>=1e3)return (b/1e3).toFixed(0)+' KB/s'; return b.toFixed(0)+' B/s'; }

async function renderBrief(c){
  const d = await api('/v1/fleet/brief');
  const s=d.stats||{};
  const ok = (!d.attention||!d.attention.length) && (!d.correlations||!d.correlations.length);
  const accent = ok?'var(--green)':'#ff9f45';
  let h=`<div class="hero"><div class="ic" style="background:${accent}22">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${accent}" stroke-width="2">${ok?'<path d="M20 6L9 17l-5-5"/>':'<path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'}</svg></div>
      <div><div class="k">Parte de tu flota</div><h3>${esc(d.headline||'')}</h3></div></div>`;
  h+=`<div class="stats">
    ${stat((s.sites_online||0)+'/'+(s.sites_total||0),'Sedes en línea', s.sites_offline?'var(--red)':'var(--green)')}
    ${stat((s.devices_online||0)+'/'+(s.devices_total||0),'Equipos','var(--cyan)')}
    ${stat(s.criticals_down_total||0,'Críticos caídos', s.criticals_down_total?'var(--red)':'var(--muted)')}
    ${stat(s.unmanaged_total||0,'Sin gestionar', s.unmanaged_total?'#ff9f45':'var(--muted)')}
    ${stat(s.alerts_total||0,'Alertas', s.alerts_total?'var(--amber)':'var(--muted)')}
  </div>`;
  if(d.correlations&&d.correlations.length){
    h+='<div class="section-t">Causas comunes</div>';
    d.correlations.forEach(x=>{ const col=sevColor(x.severity); const inf=x.confidence==='inferred';
      h+=`<div class="corr" style="border-color:${col}55">
        <div class="h"><b>${esc(x.title)}</b>
          <span class="badge" style="color:${inf?'var(--amber)':'var(--red)'};border-color:${inf?'var(--amber)':'var(--red)'};background:${inf?'#f5b64222':'#f2555a22'}">${inf?'POSIBLE':'CONFIRMADO'}</span></div>
        <p>${esc(x.detail)}</p>
        <div class="chips">${(x.sites||[]).map(s=>`<span class="chip"><span class="dot" style="background:${col}"></span>${esc(s.site_name)}</span>`).join('')}</div>
        ${x.recommendation?`<div class="reco">💡 ${esc(x.recommendation)}</div>`:''}</div>`;
    });
  }
  if(d.attention&&d.attention.length){
    h+='<div class="section-t">Necesitan atención</div>';
    d.attention.forEach(a=>{ const col=sevColor(a.severity);
      h+=`<div class="atn"><div class="bar" style="background:${col}"></div>
        <div><b>${esc(a.site_name)}</b><p>${(a.reasons||[]).map(esc).join(' · ')}</p></div></div>`;
    });
  }
  if(ok) h+=`<div class="empty">Toda tu flota está en orden — ${s.sites_total||0} sede(s) vigiladas, sin causas comunes ni sedes que atender.</div>`;
  c.innerHTML=h;
}
function stat(v,l,col){ return `<div class="stat"><div class="v" style="color:${col||'var(--ink)'}">${esc(v)}</div><div class="l">${esc(l)}</div></div>`; }

async function renderSites(c){
  const d = await api('/v1/sites'); const sites=d.sites||[];
  if(!sites.length){ c.innerHTML='<div class="empty">Aún no tienes sedes vinculadas. Vincula una desde la app.</div>'; return; }
  let rows=sites.map(s=>{ const on=s.online; const su=s.summary||{};
    return `<tr>
      <td><b>${esc(s.site_name)}</b></td>
      <td><span class="pill" style="background:${on?'#34d39922':'#f2555a22'};color:${on?'var(--green)':'var(--red)'}"><span class="dot" style="background:${on?'var(--green)':'var(--red)'}"></span>${on?'En línea':'Sin conexión'}</span></td>
      <td class="num">${su.devices_online||0}/${su.devices_total||0}</td>
      <td class="num" style="color:${su.alerts?'var(--amber)':'var(--muted)'}">${su.alerts||0}</td>
      <td class="num" style="color:${su.criticals_down?'var(--red)':'var(--muted)'}">${su.criticals_down||0}</td>
      <td class="muted">${s.remote_admin?'Sí':'No'}</td></tr>`;
  }).join('');
  c.innerHTML=`<table><thead><tr><th>Sede</th><th>Estado</th><th>Equipos</th><th>Alertas</th><th>Críticos caídos</th><th>Admin remota</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function renderThreats(c){
  const d = await api('/v1/threats'); const t=d.threats||[];
  const sm=d.summary||{};
  let h=`<div class="stats">
    ${stat(sm.critical||0,'Críticas','var(--red)')}
    ${stat(sm.high||0,'Altas','#ff9f45')}
    ${stat(sm.medium||0,'Medias','var(--amber)')}
    ${stat(sm.total||0,'Total','var(--ink)')}</div>`;
  if(!t.length){ h+='<div class="empty">Sin amenazas correlacionadas. 👌</div>'; c.innerHTML=h; return; }
  t.forEach(x=>{ const col=sevColor(x.severity);
    h+=`<div class="corr" style="border-color:${col}55">
      <div class="h"><b>${esc(x.title)}</b><span class="badge" style="color:${col};border-color:${col};background:${col}22">${esc((x.severity||'').toUpperCase())}</span></div>
      <p>${esc(x.detail)}</p>
      <div class="chips">${(x.site_names||[]).map(n=>`<span class="chip"><span class="dot" style="background:${col}"></span>${esc(n)}</span>`).join('')}</div>
      ${x.recommendation?`<div class="reco">💡 ${esc(x.recommendation)}</div>`:''}</div>`;
  });
  c.innerHTML=h;
}

let _price=null;
async function renderConsumption(c){
  const q = _price!=null?`?price_per_gb=${encodeURIComponent(_price)}`:'';
  const d = await api('/v1/fleet/consumption'+q); const sites=d.sites||[];
  let h=`<div class="priceRow">
    <span class="muted">Consumo de la flota ahora:</span> <b>${fmtBps(d.fleet_bytes_per_sec)}</b>
    <span style="flex:1"></span>
    <input id="price" type="number" step="0.01" min="0" placeholder="Precio por GB (opc.)" value="${_price!=null?_price:''}">
    <button class="btn" id="calc">Calcular</button></div>`;
  if(!sites.length){ h+='<div class="empty">Aún no hay datos de consumo. Activa el inventario completo (modo empresa) en tus sedes.</div>'; c.innerHTML=h; bindPrice(); return; }
  let rows=sites.map((s,i)=>`<tr>
      <td class="num">${i+1}</td>
      <td><b>${esc(s.site_name)}</b>${s.estimated?' <span class="muted">~</span>':''}</td>
      <td class="num">${fmtBps(s.bytes_per_sec)}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div class="barwrap"><div class="barfill" style="width:${Math.min(100,s.share_pct||0)}%"></div></div><span class="num muted">${s.share_pct||0}%</span></div></td>
      <td class="num muted">~${s.monthly_gb_est||0} GB</td>
      ${_price!=null?`<td class="num" style="color:var(--green)">~$${(s.monthly_cost_est||0).toFixed(2)}</td>`:''}
      <td class="muted">${esc(s.top?s.top.name:'—')}</td></tr>`).join('');
  h+=`<table><thead><tr><th>#</th><th>Sede</th><th>Consumo</th><th>Participación</th><th>Est. mensual</th>${_price!=null?'<th>Costo est.</th>':''}<th>Mayor consumidor</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="muted" style="font-size:11.5px;margin-top:12px">Consumo EN VIVO (algunos valores son estimados por categoría, con ~). La estimación mensual asume el ritmo actual.</p>`;
  c.innerHTML=h; bindPrice();
}
function bindPrice(){
  const b=document.getElementById('calc'); if(!b) return;
  b.onclick=()=>{ const v=parseFloat(document.getElementById('price').value); _price=(!isNaN(v)&&v>=0)?v:null; load(); };
}

// ---------- shell control ----------
function showApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('acct').textContent=store.email||'—';
  buildNav(); go('brief');
}
function showLogin(){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
}
function logout(){ store.t=null; store.r=null; showLogin(); }
document.getElementById('logout').onclick=logout;
document.getElementById('refreshBtn').onclick=load;

document.getElementById('loginForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const btn=document.getElementById('loginBtn'), err=document.getElementById('loginErr');
  err.textContent=''; btn.disabled=true; btn.textContent='Entrando…';
  try{
    await supaLogin(document.getElementById('email').value.trim(), document.getElementById('password').value);
    showApp();
  }catch(ex){ err.textContent=ex.message||'No se pudo entrar'; }
  finally{ btn.disabled=false; btn.textContent='Entrar'; }
});

// arranque: si hay token, valida entrando al panel (una llamada); si falla, login.
(async function(){
  if(store.t){
    try{ await api('/v1/sites'); showApp(); return; }catch(e){}
  }
  showLogin();
})();
</script>
